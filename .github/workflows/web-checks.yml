name: Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests and production build
        run: npm run build
